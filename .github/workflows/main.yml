name: Run tests

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  php-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            laravel: '8.*'
            testbench: '6.*'
            block-advisories: '0'
          - php: '8.1'
            laravel: '9.*'
            testbench: '7.*'
            block-advisories: '0'
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            block-advisories: '0'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            block-advisories: '0'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Install dependencies
        env:
          # Older frameworks are installed only for backward compatibility tests.
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.block-advisories || '1' }}
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest tests
